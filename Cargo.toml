[package]
name = "forkpicker"
version = "0.1.0"
edition = "2021"
description = "Discover reviewable features in GitHub forks, with evidence for maintainers and LLMs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/erikwb/forkpicker"
keywords = ["github", "forks", "code-review", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/scripts/**",
    "/PKGBUILD",
    "/build.sh",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
